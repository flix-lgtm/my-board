<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pannello">
<link rel="apple-touch-icon" href="GANG.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Il mio pannello</title>
<style>
:root{--bg:#0e0f12;--s1:#16181c;--s2:#21242a;--bd:#2b2e35;--tx:#f4f4f6;--mu:#8d919b;--gold:#ffd36b;--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;padding-top:env(safe-area-inset-top);overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:var(--s2);border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:600;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:8px}
button:active{opacity:.7}
button:disabled{opacity:.35}
button.pri{background:var(--tx);color:var(--bg)}
button.red{color:#ff7a90}
button.on{box-shadow:inset 0 0 0 2px var(--tx)}
button.ib{width:48px;padding:0;flex:none}
button.gold{color:var(--gold)}
button.lnk{background:none;color:var(--mu);min-height:40px}
input,select,textarea{font:inherit;color:inherit;background:var(--s2);border:0;border-radius:12px;min-height:48px;padding:0 14px;min-width:0;width:100%}
textarea{padding:12px 14px;resize:none;line-height:1.35}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px;min-height:54px}
.h1{font-size:24px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.pill{max-width:72%;border-radius:999px;min-height:40px;padding:0 16px;font-size:15px}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c{color:var(--mu);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;border-radius:10px}
#zoom{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#zoom img,#zoom svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#zr{position:absolute;top:10px;right:18px;min-height:36px;padding:0 14px;font-size:13px;background:#000b;display:none;z-index:3}
#bar,nav{position:relative;z-index:2}
#bar{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--s1);border-radius:22px 22px 0 0}
.row{display:flex;gap:10px;align-items:center}
.row>button:not(.ib){flex:1}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ttl .nm{font-size:21px;white-space:nowrap}
.sub,.nm small{display:block;color:var(--mu);font-size:13.5px;font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.gb{font-size:32px;font-weight:800;letter-spacing:-.5px}
.note{font-size:14px;color:#cfd2d8;background:var(--s2);border-radius:12px;padding:8px 12px;max-height:4.6em;overflow:auto;white-space:pre-wrap}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{min-height:46px;font-size:14px;padding:0 4px;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2.5px solid;flex:none}
.hint{color:var(--mu);font-size:13px;text-align:center}
nav{display:flex;background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;flex-direction:column;gap:3px;background:none;border-radius:0;min-height:58px;padding:0;font-size:10.5px;font-weight:600;color:var(--mu)}
nav button.a{color:var(--tx)}
body.full nav{display:none}
.bd{position:absolute;top:5px;left:50%;margin-left:6px;min-width:17px;height:17px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
#panel{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:6px 16px 20px;display:none;z-index:5;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;background:none;font-size:14px;border-radius:10px}
.seg button.on{background:var(--s2);box-shadow:none}
.seg.sm button{min-height:32px;font-size:13px}
.item{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:64px}
.item .gr{font-weight:800;font-size:20px;min-width:42px}
.th{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#000;flex:none}
.ibg{width:42px;height:42px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff}
.ok{color:var(--ok);font-weight:700;font-size:14px}
.mu{color:var(--mu);font-size:14px}
.unr{width:10px;height:10px;border-radius:50%;background:#ff4d6d;flex:none}
.sect{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);margin:14px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:48px 12px;display:flex;flex-direction:column;gap:6px}
.empty button{margin:12px auto 0;min-width:220px}
.banner{background:var(--s1);border-radius:12px;padding:10px 14px;color:var(--mu);font-size:13.5px;margin-bottom:12px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.msg{max-width:84%;align-self:flex-start;background:var(--s2);border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:16px}
.msg.me{align-self:flex-end;background:var(--tx);color:var(--bg);border-radius:18px 18px 6px 18px}
.msg .who{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px}
.msg .txt{white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.msg .tm{font-size:11px;opacity:.55;text-align:right;margin-top:2px}
.dsep{text-align:center;color:var(--mu);font-size:12px;margin:10px 0 4px;text-transform:capitalize}
.bcard{display:flex;gap:10px;margin:0 0 6px;padding:8px;border-radius:12px;background:rgba(0,0,0,.28);cursor:pointer}
.msg.me .bcard{background:rgba(0,0,0,.08)}
.mini{position:relative;width:84px;flex:none;border-radius:8px;overflow:hidden;background:#000}
.mini img,.mini svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bi{min-width:0;display:flex;flex-direction:column;gap:1px}
.bn{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{font-weight:800;font-size:20px}
.bs,.bt{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bo{font-size:13px;font-weight:700;margin-top:auto}
.comp input{border-radius:24px}
.comp .ib{border-radius:50%}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#mbox{background:var(--s1);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto;position:relative}
#mbox::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--bd)}
.plist{max-height:46dvh;overflow:auto}
.stars{display:flex;gap:8px;margin-top:6px}
.stars button{flex:1;font-size:26px;padding:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);box-shadow:0 6px 24px #0008;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
h2{margin:0 0 4px;font-size:19px;font-weight:700}
p.s{color:var(--mu);font-size:14px;margin:2px 0 10px}
label{font-size:14px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
.thumb{max-height:32dvh;width:auto;max-width:100%;align-self:center;border-radius:12px;background:#000}
#rect{position:fixed;inset:0;background:var(--bg);z-index:12;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#rh{display:flex;align-items:center;gap:10px;padding:8px 16px}
#rh button{min-height:44px;padding:0 16px}
#ra{flex:1;min-height:0;position:relative;overflow:hidden}
#rc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#pc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:6px;background:#000}
#rb{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--s1);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:10px}
#lp{position:absolute;left:50%;margin-left:-66px;width:132px;height:132px;border-radius:50%;border:3px solid #fff;overflow:hidden;display:none;pointer-events:none;background:#000;z-index:3;box-shadow:0 4px 20px #000a}
#lc{display:block}
input[type=range]{padding:0;min-height:36px;background:none;accent-color:#f4f4f6}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lbox h1{margin:6px 0 0;font-size:30px;letter-spacing:-.6px}
.lbox p{margin:0;color:var(--mu);font-size:15px}
.lerr{color:#ff7a90;font-size:14px;min-height:18px}
</style>
</head>
<body>
<div id="top"></div>
<div id="area">
  <div id="stage"><div id="zoom"><img id="ph" alt=""><svg id="ov"></svg></div></div>
  <button id="zr">Reimposta zoom</button>
  <div id="panel"></div>
</div>
<div id="bar"></div>
<nav id="nav"></nav>
<div id="rect"><div id="rh"></div><div id="ra"></div><div id="rb"></div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="login"></div>
<div id="toast"></div>
<input type="file" id="fphoto" accept="image/*" hidden>
<input type="file" id="fimport" accept=".json,application/json" hidden>
<script>
/* ===================== Costanti e utilità ===================== */
const VER='6.1';   // cambia a ogni aggiornamento: tutti devono rifare l'accesso
const DB='https://duxpan-856ff-default-rtdb.europe-west1.firebasedatabase.app';       // ← indirizzo del Realtime Database di Firebase (vedi guida). Vuoto = social spento
const GR=['ss','6A+','6B','6B+','6C','6C+','7A','7A+','7B','7B+','7C','7C+','8A','negro','negro scuro'];
const T={s:{c:'#2ee59d',l:'Start'},h:{c:'#3aa0ff',l:'Prese'},f:{c:'#ffb020',l:'Piedi'},t:{c:'#ff4d6d',l:'Top'}};
const ORDER=['s','h','f','t'];
const IC={board:'<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="10" cy="16" r="1.5"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>',chat:'<path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12l5 5 9-10"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.5 3.2-5 6.5-5s5.8 1.5 6.5 5"/><path d="M16 5a3.5 3.5 0 010 7M18 15c2 .5 3.2 2 3.5 5"/>',note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>'};
const ic=(n,s=24,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const gcol=g=>{const i=GR.indexOf(g);return i<3?'#34d399':i<7?'#60a5fa':i<10?'#fbbf24':'#fb7185'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const mid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const avatar=(n,sz=40)=>`<span class="av" style="width:${sz}px;height:${sz}px;background:hsl(${hue(n)},45%,32%);font-size:${Math.round(sz*.42)}px">${esc((String(n||'?')[0]||'?').toUpperCase())}</span>`;
const fmtT=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const closeM=()=>{$('modal').style.display='none'};

/* ===================== Stato ===================== */
let D={panels:[],lists:[],cur:null},pending=null,draft=null,R=null;
let idx=0,view='view',edit=null,tool='h',filter='all',hist=[],openList=null,Z={k:1,x:0,y:0};
let remote=null,RV=null,SL=null,CH=null,SLmode=0;
let sess=ls.get('pn_sess'),seen=ls.get('pn_seen')||{};
const EMPTY={photo:null,ar:1,problems:[]};
const PN=()=>D.panels.find(p=>p.id===D.cur)||D.panels[0]||EMPTY;
const SPN=()=>remote?remote.pn:PN();
const cur=()=>PN().problems[idx];

/* ===================== Salvataggio locale (IndexedDB) ===================== */
const kv={_d:null,
  open(){return this._d||(this._d=new Promise((res,rej)=>{const r=indexedDB.open('pannello',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){try{const db=await this.open();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}},
  async set(k,v){try{const db=await this.open();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
};
const save=()=>kv.set('d',D);
function mig(d){
  if(!d.panels){
    if(!d.photo)return{panels:[],lists:[],cur:null};
    const p={id:Date.now(),name:'Pannello 1',photo:d.photo,ar:d.ar||1,problems:d.problems||[]};
    return{panels:[p],lists:[],cur:p.id};
  }
  d.lists=d.lists||[];return d;
}

/* ===================== Stage: foto, zoom, cerchi ===================== */
function clampZ(){const s=$('stage'),w=s.offsetWidth,h=s.offsetHeight;Z.k=Math.min(6,Math.max(1,Z.k));Z.x=Math.min(0,Math.max(w*(1-Z.k),Z.x));Z.y=Math.min(0,Math.max(h*(1-Z.k),Z.y))}
function applyZ(){clampZ();$('zoom').style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.k})`;$('zr').style.display=Z.k>1.02?'flex':'none'}
function zreset(){Z={k:1,x:0,y:0};applyZ()}
function fit(){
  const a=$('area'),s=$('stage'),pn=SPN();
  if(!pn.photo){s.style.display='none';return}
  s.style.display='block';
  let w=a.clientWidth,h=w/pn.ar;
  if(h>a.clientHeight){h=a.clientHeight;w=h*pn.ar}
  s.style.width=w+'px';s.style.height=h+'px';applyZ();
}
function draw(holds){
  const W=1000,H=1000/SPN().ar,r=26,o=$('ov');
  o.setAttribute('viewBox',`0 0 ${W} ${H}`);
  o.innerHTML=(holds||[]).map(p=>{
    const c=T[p.t].c,x=p.x*W,y=p.y*H,rr=p.t==='f'?r*.7:r;
    return `<circle cx="${x}" cy="${y}" r="${rr+2}" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="9"/><circle cx="${x}" cy="${y}" r="${rr}" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="6"/>`;
  }).join('');
}
function miniHTML(b){
  const ar=b.ar||1,H=1000/ar,w=84;
  const svg=`<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none">${(b.holds||[]).map(p=>`<circle cx="${p.x*1000}" cy="${p.y*H}" r="${p.t==='f'?22:32}" fill="none" stroke="${T[p.t].c}" stroke-width="12"/>`).join('')}</svg>`;
  return `<div class="mini" data-pid="${b.pid}" style="height:${Math.round(w/ar)}px"><img alt="">${svg}</div>`;
}

/* ===================== Liste personali ===================== */
const has=(l,pid,bid)=>l.items.some(x=>x.p===pid&&x.b===bid);
const inAny=(pid,bid)=>D.lists.some(l=>has(l,pid,bid));
const lres=l=>l.items.map(it=>{const pn=D.panels.find(x=>x.id===it.p);if(!pn)return null;const i=pn.problems.findIndex(b=>b.id===it.b);return i<0?null:{pn,bl:pn.problems[i],i}}).filter(Boolean);

/* ===================== Render principale ===================== */
const NAV=[['view','board','Blocchi'],['list','grid','Elenco'],['new','plus','Nuovo'],['social','chat','Social'],['set','user','Profilo']];
$('nav').innerHTML=NAV.map(([v,i,l])=>`<button data-v="${v}">${ic(i)}<span>${l}</span>${v==='social'?'<b class="bd" id="bdg"></b>':''}</button>`).join('');
function setNav(){
  const a=view==='edit'?(remote?(RV&&RV.src==='msg'?'social':'list'):'new'):view==='rview'?(RV&&RV.src==='msg'?'social':'list'):({lists:'list',listd:'list',sld:'list',chat:'social'}[view]||view);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.v===a));
}
const pillHTML=()=>D.panels.length?`<button class="pill" id="pp"><span>${esc(PN().name)}</span> ▾</button>`:'<div class="h1">Il mio pannello</div>';
const bindPill=()=>{const b=$('pp');if(b)b.onclick=panelSheet};
const mainSeg=a=>`<div class="seg"><button data-m="list" class="${a==='list'?'on':''}">Blocchi</button><button data-m="lists" class="${a==='lists'?'on':''}">Liste</button></div>`;
const bindMain=P=>P.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{view=b.dataset.m;render()});
function render(){
  setNav();
  const spn=SPN(),ph=$('ph'),P=$('panel');
  P.style.display='none';P.onclick=null;
  document.body.classList.toggle('full',view==='chat');
  if(ph._p!==spn.photo){ph.src=spn.photo||'';ph._p=spn.photo}
  ({edit:rEdit,list:rList,lists:rLists,listd:rListD,sld:rSLD,rview:rRView,social:rSocial,chat:rChat,set:rSet}[view]||rView)();
  $('bar').style.display=$('bar').innerHTML.trim()?'':'none';
  fit();requestAnimationFrame(fit);
}
function leave(){edit=null;remote=null;RV=null;CH=null;SL=null;zreset()}

/* ---------- Visualizzatore ---------- */
function rView(){
  const pn=PN(),p=cur(),n=pn.problems.length,P=$('panel'),top=$('top'),bar=$('bar');
  if(!pn.photo){
    top.innerHTML='<div class="h1">Il mio pannello</div>';bar.innerHTML='';
    P.style.display='block';

/* ---------- Ridimensiona: raddrizzamento prospettico (offline) ---------- */
function homog(P,Q){
  const A=[],B=[];
  for(let i=0;i<4;i++){const[u,v]=Q[i],[x,y]=P[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]);B.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]);B.push(y)}
  const n=8;
  for(let i=0;i<n;i++){
    let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];[B[i],B[m]]=[B[m],B[i]];
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];B[r]-=f*B[i]}
  }
  const h=new Array(n);
  for(let i=n-1;i>=0;i--){let t=B[i];for(let c=i+1;c<n;c++)t-=A[i][c]*h[c];h[i]=t/A[i][i]}
  return h;
}
function warp(S,P,W,H){
  const h=homog(P,[[0,0],[W,0],[W,H],[0,H]]),sd=S.data,sw=S.width,sh=S.height;
  const out=new ImageData(W,H),od=out.data,mx=sw-1.001,my=sh-1.001;
  for(let j=0;j<H;j++){
    for(let i=0;i<W;i++){
      const u=i+.5,v=j+.5,d=h[6]*u+h[7]*v+1;
      let x=(h[0]*u+h[1]*v+h[2])/d-.5,y=(h[3]*u+h[4]*v+h[5])/d-.5;
      x=x<0?0:x>mx?mx:x;y=y<0?0:y>my?my:y;
      const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,k=(y0*sw+x0)*4,k2=k+sw*4;
      const a=(1-fx)*(1-fy),b=fx*(1-fy),c=(1-fx)*fy,e=fx*fy,o=(j*W+i)*4;
      od[o]=sd[k]*a+sd[k+4]*b+sd[k2]*c+sd[k2+4]*e;
      od[o+1]=sd[k+1]*a+sd[k+5]*b+sd[k2+1]*c+sd[k2+5]*e;

const rScr=p=>[p[0]*R.d.s+R.d.ox,p[1]*R.d.s+R.d.oy];
function rSetup(){
  const A=$('ra'),c=$('rc'),dpr=Math.min(3,window.devicePixelRatio||2);
  const aw=A.clientWidth,ah=A.clientHeight;
  c.width=aw*dpr;c.height=ah*dpr;
  const s=Math.min(aw/R.cv.width,ah/R.cv.height);
  R.d={dpr,aw,ah,s,ox:(aw-R.cv.width*s)/2,oy:(ah-R.cv.height*s)/2};
  const l=$('lc');l.width=132*dpr;l.height=132*dpr;l.style.width=l.style.height='132px';
  rDraw();
  c.onpointerdown=e=>{
    let best=-1,bd=64;
    R.p.forEach((p,i)=>{const q=rScr(p),d=Math.hypot(q[0]-e.offsetX,q[1]-e.offsetY);if(d<bd){bd=d;best=i}});
    if(best<0)return;
    const q=rScr(R.p[best]);R.drag={i:best,dx:q[0]-e.offsetX,dy:q[1]-e.offsetY};
    c.setPointerCapture(e.pointerId);rLoupe();
  };
  c.onpointermove=e=>{
    if(!R.drag)return;
    const X=Math.max(0,Math.min(R.d.aw,e.offsetX+R.drag.dx)),Y=Math.max(0,Math.min(R.d.ah,e.offsetY+R.drag.dy));
    R.p[R.drag.i]=[(X-R.d.ox)/R.d.s,(Y-R.d.oy)/R.d.s];
    rDraw();rLoupe();
  };
  c.onpointerup=c.onpointercancel=()=>{R.drag=null;$('lp').style.display='none';rDraw()};
}
function rDraw(){
  const d=R.d,c=$('rc'),x=c.getContext('2d');
  x.setTransform(d.dpr,0,0,d.dpr,0,0);x.clearRect(0,0,d.aw,d.ah);
  x.drawImage(R.cv,d.ox,d.oy,R.cv.width*d.s,R.cv.height*d.s);
  const P=R.p.map(rScr);
  x.lineWidth=2;x.strokeStyle='#ffd36b';x.beginPath();
  P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
  P.forEach((p,i)=>{
    x.beginPath();x.arc(p[0],p[1],15,0,6.2832);x.fillStyle='rgba(255,211,107,.18)';x.fill();
    x.lineWidth=2.5;x.strokeStyle='#ffd36b';x.stroke();
    x.beginPath();x.arc(p[0],p[1],2.5,0,6.2832);x.fillStyle='#ffd36b';x.fill();
    x.fillStyle='#fff';x.font='600 12px -apple-system,sans-serif';x.fillText(i+1,p[0]+19,p[1]-12);
  });
}
function rLoupe(){
  const d=R.d,lp=$('lp'),l=$('lc'),x=l.getContext('2d'),P=R.p[R.drag.i],sz=l.width,rs=44/d.s,q=rScr(P);
  lp.style.display='block';
  lp.style.top=q[1]>d.ah/2?'10px':'auto';lp.style.bottom=q[1]>d.ah/2?'auto':'10px';
  x.fillStyle='#000';x.fillRect(0,0,sz,sz);
  try{x.drawImage(R.cv,P[0]-rs/2,P[1]-rs/2,rs,rs,0,0,sz,sz)}catch(e){}
  const f=v=>[(v[0]-(P[0]-rs/2))/rs*sz,(v[1]-(P[1]-rs/2))/rs*sz];
  x.lineWidth=2*d.dpr;x.strokeStyle='#ffd36b';x.beginPath();
  R.p.map(f).forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
  x.strokeStyle='#fff';x.lineWidth=d.dpr;x.beginPath();x.moveTo(sz/2-10*d.dpr,sz/2);x.lineTo(sz/2+10*d.dpr,sz/2);x.moveTo(sz/2,sz/2-10*d.dpr);x.lineTo(sz/2,sz/2+10*d.dpr);x.stroke();
}
function rImg(){if(!R.S)R.S=R.cv.getContext('2d').getImageData(0,0,R.cv.width,R.cv.height);return R.S}
function rPrev(){
  const A=$('ra'),c=$('pc'),W=520,H=Math.round(W*R.ratio);
  c.width=W;c.height=H;
  const s=Math.min(A.clientWidth/W,A.clientHeight/H)*.98;

  $('rv').textContent=R.ratio.toFixed(2);
}
function rFinish(){

}

const ptr=new Map();let G=null;const A=$('area');
const mid2=()=>{const v=[...ptr.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2,d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1}};

  const r=$('stage').getBoundingClientRect();
  if(G.m==='p'&&ptr.size===2){

function pend(e){

async function chatLoad(){
  const c=CH;if(!c)return;
  const qs=c.key?`?orderBy=%22%24key%22&startAt=%22${c.key}%22`:'?orderBy=%22%24key%22&limitToLast=60';
  const o=await net('GET','chats/'+c.id,undefined,qs)||{};
  if(CH!==c)return;
  const add=Object.keys(o).sort().filter(k=>!c.msgs.some(m=>m.id===k)).map(k=>Object.assign({id:k},o[k]));
  if(add.length){
    c.msgs.push(...add);c.key=c.msgs[c.msgs.length-1].id;
    const lm=c.msgs[c.msgs.length-1];seen[c.id]=Math.max(seen[c.id]||0,lm.t);ls.set('pn_seen',seen);updateBadge();
    chatPaint(true);
  }
}

  `<div class="row" style="margin-top:14px"><button class="pri" id="sla">＋ Aggiungi un mio blocco</button></div>`;
  P.querySelectorAll('.item').forEach(e=>e.onclick=()=>openR(SL.items,+e.dataset.i,'list',SL.id));
  $('sla').onclick=()=>pickBlock(async(pn,p)=>{await slAdd({id:SL.id,n:SL.meta.n},pn,p);try{await slLoad()}catch(e){}});
  $('slo').onclick=slOptions;
}
async function slOptions(){
  const m=$('modal'),b=$('mbox');m.style.display='flex';
  try{await getUsers(true)}catch(e){}
  const ms=Object.keys(SL.meta.m||{}),own=SL.meta.o===sess.key;
  b.innerHTML=`<h2>${esc(SL.meta.n)}</h2><p class="s">Chi è nella lista può vedere, salvare e modificare i blocchi.</p><div class="plist">${ms.map(k=>`<div class="item" style="min-height:56px">${avatar(uname(k),36)}<span class="nm">${esc(uname(k))}${k===SL.meta.o?'<small>Creatore</small>':''}</span></div>`).join('')}</div><button id="sa">＋ Aggiungi una persona</button><div class="row"><button id="sr">Rinomina</button><button id="sx" class="red">${own?'Elimina lista':'Esci dalla lista'}</button></div><button class="pri" id="sd">Fatto</button>`;
  $('sd').onclick=closeM;
  $('sa').onclick=()=>{
    const cand=Object.entries(S.users||{}).filter(([k])=>ms.indexOf(k)<0);
    b.innerHTML=`<h2>Aggiungi una persona</h2>${cand.length?`<div class="plist">${cand.map(([k,v])=>`<div class="item" data-k="${esc(k)}">${avatar(v.n,36)}<span class="nm">${esc(v.n)}</span></div>`).join('')}</div>`:'<p class="s">Sono già tutti nella lista.</p>'}<button id="xx">Indietro</button>`;
    $('xx').onclick=slOptions;
    b.querySelectorAll('.item').forEach(e=>e.onclick=async()=>{
      const k=e.dataset.k;
      try{await net('PATCH','',{[`lists/${SL.id}/m/${k}`]:true,[`ul/${k}/${SL.id}`]:{n:SL.meta.n},[`lists/${SL.id}/u`]:Date.now()});await slLoad();toast(uname(k)+' aggiunto');slOptions()}catch(er){toast('Non riuscito')}
    });
  };
  $('sr').onclick=async()=>{
    const n=prompt('Nome della lista',SL.meta.n);if(!n||!n.trim())return;
    const u={[`lists/${SL.id}/n`]:n.trim(),[`lists/${SL.id}/u`]:Date.now()};ms.forEach(k=>{u[`ul/${k}/${SL.id}/n`]=n.trim()});
    try{await net('PATCH','',u);S.sl=null;S.slT=0;await slLoad();closeM()}catch(e){toast('Non riuscito')}
  };
  $('sx').onclick=async()=>{
    if(!confirm(own?'Eliminare la lista per tutti?':'Uscire dalla lista?'))return;
    const u={};
    if(own){u[`lists/${SL.id}`]=null;u[`li/${SL.id}`]=null;ms.forEach(k=>{u[`ul/${k}/${SL.id}`]=null})}
    else{u[`lists/${SL.id}/m/${sess.key}`]=null;u[`ul/${sess.key}/${SL.id}`]=null}
    try{await net('PATCH','',u);closeM();SL=null;S.sl=null;S.slT=0;view='lists';render();toast(own?'Lista eliminata':'Sei uscito dalla lista')}catch(e){toast('Non riuscito')}
  };
}

/* ---------- Sincronizzazione periodica ---------- */
let tn=0;
async function tick(){
  if(!social()||document.hidden||!navigator.onLine||$('login').style.display==='flex')return;
  if(!sess.ok){await verifyGroup();if(!sess.ok)return}
  tn++;
  try{
    if(view==='chat'&&CH)await chatLoad();
    if(view==='chat'||view==='social'||tn%3===0)await lastPoll();
    if(view==='sld'&&SL&&SL.meta&&tn%2===0)await slPoll();
  }catch(e){}
}
setInterval(tick,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
window.addEventListener('online',()=>{toast('Di nuovo online');tick()});
window.addEventListener('offline',()=>toast('Sei offline'));

/* ===================== Avvio ===================== */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
(async()=>{
  const d=await kv.get('d');if(d)D=mig(d);
  if(!D.panels.some(p=>p.id===D.cur))D.cur=D.panels[0]?D.panels[0].id:null;
  const p=PN();idx=Math.min(p.last||0,Math.max(0,p.problems.length-1));
  render();updateBadge();
  if(!sess||sess.ver!==VER)showLogin();else tick();
})();
</script>
