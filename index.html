<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pannello">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Il mio pannello</title>
<style>
:root{--bg:#0e0f12;--s1:#16181c;--s2:#21242a;--bd:#2b2e35;--tx:#f4f4f6;--mu:#8d919b;--gold:#ffd36b;--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;padding-top:env(safe-area-inset-top);overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:var(--s2);border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:600;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:8px}
button:active{opacity:.7}
button:disabled{opacity:.35}
button.pri{background:var(--tx);color:var(--bg)}
button.red{color:#ff7a90}
button.on{box-shadow:inset 0 0 0 2px var(--tx)}
button.ib{width:48px;padding:0;flex:none}
button.gold{color:var(--gold)}
button.lnk{background:none;color:var(--mu);min-height:40px}
input,select,textarea{font:inherit;color:inherit;background:var(--s2);border:0;border-radius:12px;min-height:48px;padding:0 14px;min-width:0;width:100%}
textarea{padding:12px 14px;resize:none;line-height:1.35}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px;min-height:54px}
.h1{font-size:24px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.pill{max-width:72%;border-radius:999px;min-height:40px;padding:0 16px;font-size:15px}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c{color:var(--mu);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;border-radius:10px}
#zoom{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#zoom img,#zoom svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#zr{position:absolute;top:10px;right:18px;min-height:36px;padding:0 14px;font-size:13px;background:#000b;display:none;z-index:3}
#bar,nav{position:relative;z-index:2}
#bar{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--s1);border-radius:22px 22px 0 0}
.row{display:flex;gap:10px;align-items:center}
.row>button:not(.ib){flex:1}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ttl .nm{font-size:21px;white-space:nowrap}
.sub,.nm small{display:block;color:var(--mu);font-size:13.5px;font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.gb{font-size:32px;font-weight:800;letter-spacing:-.5px}
.note{font-size:14px;color:#cfd2d8;background:var(--s2);border-radius:12px;padding:8px 12px;max-height:4.6em;overflow:auto;white-space:pre-wrap}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{min-height:46px;font-size:14px;padding:0 4px;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2.5px solid;flex:none}
.hint{color:var(--mu);font-size:13px;text-align:center}
nav{display:flex;background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;flex-direction:column;gap:3px;background:none;border-radius:0;min-height:58px;padding:0;font-size:10.5px;font-weight:600;color:var(--mu)}
nav button.a{color:var(--tx)}
body.full nav{display:none}
.bd{position:absolute;top:5px;left:50%;margin-left:6px;min-width:17px;height:17px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
#panel{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:6px 16px 20px;display:none;z-index:5;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;background:none;font-size:14px;border-radius:10px}
.seg button.on{background:var(--s2);box-shadow:none}
.seg.sm button{min-height:32px;font-size:13px}
.item{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:64px}
.item .gr{font-weight:800;font-size:20px;min-width:42px}
.th{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#000;flex:none}
.ibg{width:42px;height:42px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff}
.ok{color:var(--ok);font-weight:700;font-size:14px}
.mu{color:var(--mu);font-size:14px}
.unr{width:10px;height:10px;border-radius:50%;background:#ff4d6d;flex:none}
.sect{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);margin:14px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:48px 12px;display:flex;flex-direction:column;gap:6px}
.empty button{margin:12px auto 0;min-width:220px}
.banner{background:var(--s1);border-radius:12px;padding:10px 14px;color:var(--mu);font-size:13.5px;margin-bottom:12px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.msg{max-width:84%;align-self:flex-start;background:var(--s2);border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:16px}
.msg.me{align-self:flex-end;background:var(--tx);color:var(--bg);border-radius:18px 18px 6px 18px}
.msg .who{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px}
.msg .txt{white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.msg .tm{font-size:11px;opacity:.55;text-align:right;margin-top:2px}
.dsep{text-align:center;color:var(--mu);font-size:12px;margin:10px 0 4px;text-transform:capitalize}
.bcard{display:flex;gap:10px;margin:0 0 6px;padding:8px;border-radius:12px;background:rgba(0,0,0,.28);cursor:pointer}
.msg.me .bcard{background:rgba(0,0,0,.08)}
.mini{position:relative;width:84px;flex:none;border-radius:8px;overflow:hidden;background:#000}
.mini img,.mini svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bi{min-width:0;display:flex;flex-direction:column;gap:1px}
.bn{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{font-weight:800;font-size:20px}
.bs,.bt{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bo{font-size:13px;font-weight:700;margin-top:auto}
.comp input{border-radius:24px}
.comp .ib{border-radius:50%}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#mbox{background:var(--s1);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto;position:relative}
#mbox::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--bd)}
.plist{max-height:46dvh;overflow:auto}
.stars{display:flex;gap:8px;margin-top:6px}
.stars button{flex:1;font-size:26px;padding:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);box-shadow:0 6px 24px #0008;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
h2{margin:0 0 4px;font-size:19px;font-weight:700}
p.s{color:var(--mu);font-size:14px;margin:2px 0 10px}
label{font-size:14px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
.thumb{max-height:32dvh;width:auto;max-width:100%;align-self:center;border-radius:12px;background:#000}
#rect{position:fixed;inset:0;background:var(--bg);z-index:12;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#rh{display:flex;align-items:center;gap:10px;padding:8px 16px}
#rh button{min-height:44px;padding:0 16px}
#ra{flex:1;min-height:0;position:relative;overflow:hidden}
#rc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#pc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:6px;background:#000}
#rb{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--s1);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:10px}
#lp{position:absolute;left:50%;margin-left:-66px;width:132px;height:132px;border-radius:50%;border:3px solid #fff;overflow:hidden;display:none;pointer-events:none;background:#000;z-index:3;box-shadow:0 4px 20px #000a}
#lc{display:block}
input[type=range]{padding:0;min-height:36px;background:none;accent-color:#f4f4f6}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lbox h1{margin:6px 0 0;font-size:30px;letter-spacing:-.6px}
.lbox p{margin:0;color:var(--mu);font-size:15px}
.lerr{color:#ff7a90;font-size:14px;min-height:18px}
.av{object-fit:cover}
input[type=search]{-webkit-appearance:none;appearance:none}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:4px 0 18px}
.prof .pn{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-top:4px}
.prof .pbio{color:#cfd2d8;font-size:15px;max-width:320px;white-space:pre-wrap}
.stats{display:flex;gap:10px;width:100%;margin:10px 0 4px}
.stats div{flex:1;background:var(--s1);border-radius:14px;padding:10px 6px}
.stats b{display:block;font-size:21px;letter-spacing:-.3px}
.stats span{font-size:12px;color:var(--mu)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%}
.fld{display:flex;flex-direction:column;gap:14px}
#mbox .seg{background:var(--s2)}
#mbox .seg button.on{background:var(--s1)}
.cnt{font-style:normal;background:#ff4d6d;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;margin-left:6px}
button.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:11px;flex:none}
.item .acts{display:flex;gap:8px;flex:none}
.pyr{margin-bottom:6px}
.pr{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.pr>span{width:34px;font-weight:800;font-size:15px}
.pr>div{flex:1;height:10px;background:var(--s1);border-radius:5px;overflow:hidden}
.pr i{display:block;height:100%;border-radius:5px}
.pr b{width:26px;text-align:right;font-size:14px}
.tg{width:52px;height:30px;min-height:30px;border-radius:15px;padding:0;background:var(--s2);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8d919b;transition:all .18s}
.tg.on{background:#34d399}
.tg.on::after{left:25px;background:#fff}
.tag{font-size:11px;font-weight:700;color:var(--gold);margin-left:8px;letter-spacing:.2px}
.dsep.sys{text-transform:none;background:var(--s1);border-radius:10px;padding:5px 12px;align-self:center;max-width:90%}
#lightbox{position:fixed;inset:0;background:#000;z-index:25;display:none;touch-action:none;overflow:hidden}
#lbi{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform:translate(-50%,-50%);transform-origin:center;will-change:transform;pointer-events:none;-webkit-user-drag:none}
#lbx{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;z-index:2;background:#000a;width:44px;min-height:44px;padding:0;border-radius:50%}
#lbn{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:18px;font-weight:700;z-index:2;text-shadow:0 1px 6px #000}
.av[data-zoom]{cursor:pointer}
</style>
</head>
<body>
<div id="top"></div>
<div id="area">
  <div id="stage"><div id="zoom"><img id="ph" alt=""><svg id="ov"></svg></div></div>
  <button id="zr">Reimposta zoom</button>
  <div id="panel"></div>
</div>
<div id="bar"></div>
<nav id="nav"></nav>
<div id="rect"><div id="rh"></div><div id="ra"></div><div id="rb"></div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="lightbox"><button id="lbx" aria-label="Chiudi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="lbn"></div><img id="lbi" alt=""></div>
<div id="login"></div>
<div id="toast"></div>
<input type="file" id="fphoto" accept="image/*" hidden>
<input type="file" id="fimport" accept=".json,application/json" hidden>
<input type="file" id="favatar" accept="image/*" hidden>
<input type="file" id="fgroup" accept="image/*" hidden>
<script>
/* ===================== Costanti e utilità ===================== */
const VER='10.0';   // cambia a ogni aggiornamento: tutti devono rifare l'accesso
const DB='https://duxpan-856ff-default-rtdb.europe-west1.firebasedatabase.app';       // ← indirizzo del Realtime Database di Firebase (vedi guida). Vuoto = social spento
const GR=['4','5','5+','6A','6A+','6B','6B+','6C','6C+','7A','7A+','7B','7B+','7C','7C+','8A'];
const T={s:{c:'#2ee59d',l:'Start'},h:{c:'#3aa0ff',l:'Prese'},f:{c:'#ffb020',l:'Piedi'},t:{c:'#ff4d6d',l:'Top'}};
const ORDER=['s','h','f','t'];
const IC={board:'<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="10" cy="16" r="1.5"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>',chat:'<path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12l5 5 9-10"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.5 3.2-5 6.5-5s5.8 1.5 6.5 5"/><path d="M16 5a3.5 3.5 0 010 7M18 15c2 .5 3.2 2 3.5 5"/>',note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>'};
const ic=(n,s=24,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const gcol=g=>{const i=GR.indexOf(g);return i<3?'#34d399':i<7?'#60a5fa':i<10?'#fbbf24':'#fb7185'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const mid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const PAL=['#3b6df0','#2ea37a','#c9822b','#d6455d','#8b5cf6','#d9488f','#0ea5b7','#6b7280'];
function avatarRaw(n,sz,av,co,z){
  const st=`width:${sz}px;height:${sz}px`;
  if(av)return `<img class="av" src="${esc(av)}" style="${st}" ${z?`data-zoom="${esc(z)}"`:''} draggable="false" alt="">`;
  return `<span class="av" style="${st};background:${co?PAL[co-1]:`hsl(${hue(n)},45%,32%)`};font-size:${Math.round(sz*.42)}px">${esc((String(n||'?')[0]||'?').toUpperCase())}</span>`;
}
function avatar(n,sz=40,k,z){
  let av='',co=0;
  const u=k&&S.users&&S.users[k];
  if(u){av=u.av||'';co=u.co||0}
  else if(sess&&k&&k===sess.key&&sess.prof){av=sess.prof.av||'';co=sess.prof.co||0}
  return avatarRaw(n,sz,av,co,z&&k?k:'');
}
const fmtT=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const closeM=()=>{$('modal').style.display='none'};

/* ===================== Stato ===================== */
let D={panels:[],lists:[],cur:null,prefs:{}},pending=null,draft=null,R=null;
let idx=0,view='view',edit=null,tool='h',filter='all',hist=[],openList=null,Z={k:1,x:0,y:0};
let remote=null,RV=null,SL=null,CH=null,SLmode=0;
let sess=ls.get('pn_sess'),seen=ls.get('pn_seen')||{},PE=null,UP=null,PQ='';
const F=Object.assign({q:'',gmin:'',gmax:'',date:'all',d1:'',d2:'',status:'all',scope:'panel',sort:'new'},ls.get('pn_f')||{});
const EMPTY={photo:null,ar:1,problems:[]};
const PN=()=>D.panels.find(p=>p.id===D.cur)||D.panels[0]||EMPTY;
const SPN=()=>remote?remote.pn:PN();
const cur=()=>PN().problems[idx];

/* ===================== Salvataggio locale (IndexedDB) ===================== */
const kv={_d:null,
  open(){return this._d||(this._d=new Promise((res,rej)=>{const r=indexedDB.open('pannello',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){try{const db=await this.open();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}},
  async set(k,v){try{const db=await this.open();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
};
function save(){kv.set('d',D);if(typeof schedSync==='function')schedSync()}
function mig(d){
  if(!d.panels){
    if(!d.photo)return{panels:[],lists:[],cur:null,prefs:{}};
    const p={id:Date.now(),name:'Pannello 1',photo:d.photo,ar:d.ar||1,problems:d.problems||[]};
    return{panels:[p],lists:[],cur:p.id,prefs:{}};
  }
  d.lists=d.lists||[];d.prefs=d.prefs||{};return d;
}

/* ===================== Stage: foto, zoom, cerchi ===================== */
function clampZ(){const s=$('stage'),w=s.offsetWidth,h=s.offsetHeight;Z.k=Math.min(6,Math.max(1,Z.k));Z.x=Math.min(0,Math.max(w*(1-Z.k),Z.x));Z.y=Math.min(0,Math.max(h*(1-Z.k),Z.y))}
function applyZ(){clampZ();$('zoom').style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.k})`;$('zr').style.display=Z.k>1.02?'flex':'none'}
function zreset(){Z={k:1,x:0,y:0};applyZ()}
function fit(){
  const a=$('area'),s=$('stage'),pn=SPN();
  if(!pn.photo){s.style.display='none';return}
  s.style.display='block';
  let w=a.clientWidth,h=w/pn.ar;
  if(h>a.clientHeight){h=a.clientHeight;w=h*pn.ar}
  s.style.width=w+'px';s.style.height=h+'px';applyZ();
}
function draw(holds){
  const W=1000,H=1000/SPN().ar,r=26,o=$('ov');
  o.setAttribute('viewBox',`0 0 ${W} ${H}`);
  o.innerHTML=(holds||[]).map(p=>{
    const c=T[p.t].c,x=p.x*W,y=p.y*H,rr=p.t==='f'?r*.7:r;
    return `<circle cx="${x}" cy="${y}" r="${rr+2}" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="9"/><circle cx="${x}" cy="${y}" r="${rr}" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="6"/>`;
  }).join('');
}
function miniHTML(b){
  const ar=b.ar||1,H=1000/ar,w=84;
  const svg=`<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none">${(b.holds||[]).map(p=>`<circle cx="${p.x*1000}" cy="${p.y*H}" r="${p.t==='f'?22:32}" fill="none" stroke="${T[p.t].c}" stroke-width="12"/>`).join('')}</svg>`;
  return `<div class="mini" data-pid="${b.pid}" style="height:${Math.round(w/ar)}px"><img alt="">${svg}</div>`;
}

/* ---------- Elenco blocchi: ricerca, filtri, ordinamento ---------- */
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const created=b=>b.c||(b.id>1e14?Math.floor(b.id/1000):b.id);
const SORTS=[['new','Più recenti'],['old','Meno recenti'],['az','Nome A–Z'],['za','Nome Z–A'],['gup','Grado: facili prima'],['gdn','Grado: difficili prima']];
const fSave=()=>ls.set('pn_f',F);
const fActive=()=>!!(F.gmin||F.gmax||F.date!=='all'||F.status!=='all'||F.scope!=='panel');
function fReset(){Object.assign(F,{q:'',gmin:'',gmax:'',date:'all',d1:'',d2:'',status:'all',scope:'panel'});fSave()}
function fRange(){
  let a=0,b=Infinity;
  if(F.date==='today'){const d=new Date();d.setHours(0,0,0,0);a=d.getTime()}
  else if(F.date==='7'||F.date==='30')a=Date.now()-(+F.date)*864e5;
  else if(F.date==='range'){if(F.d1)a=new Date(F.d1+'T00:00:00').getTime();if(F.d2)b=new Date(F.d2+'T23:59:59').getTime()}
  return[a,b];
}
function fList(){
  const q=norm(F.q.trim()),r=fRange(),gi=g=>GR.indexOf(g);
  const g1=F.gmin?gi(F.gmin):0,g2=F.gmax?gi(F.gmax):GR.length-1,lo=Math.min(g1,g2),hi=Math.max(g1,g2);
  let L=[];(F.scope==='all'?D.panels:[PN()]).forEach(pn=>pn.problems.forEach((p,i)=>L.push({pn,p,i})));
  L=L.filter(({p})=>{
    if(q&&!(norm(p.name).includes(q)||norm(p.note).includes(q)||norm(p.by).includes(q)||norm(p.from).includes(q)))return false;
    const g=gi(p.grade);if(g<lo||g>hi)return false;
    const c=created(p);if(c<r[0]||c>r[1])return false;
    if(F.status==='todo'&&p.send)return false;
    if(F.status==='done'&&!p.send)return false;
    return true;
  });
  const nm=(a,b)=>String(a.p.name||'').localeCompare(String(b.p.name||''),'it',{sensitivity:'base'});
  const cmp={new:(a,b)=>created(b.p)-created(a.p),old:(a,b)=>created(a.p)-created(b.p),az:nm,za:(a,b)=>nm(b,a),gup:(a,b)=>gi(a.p.grade)-gi(b.p.grade)||nm(a,b),gdn:(a,b)=>gi(b.p.grade)-gi(a.p.grade)||nm(a,b)}[F.sort]||nm;
  return L.sort(cmp);
}
function rList(){
  const P=$('panel'),pn=PN();P.style.display='block';
  $('top').innerHTML=`${pillHTML()}<span class="c">${pn.problems.filter(p=>p.send).length}/${pn.problems.length} saliti</span>`;bindPill();$('bar').innerHTML='';

  <div class="row" style="margin-bottom:10px"><span class="mu" id="fcount" style="flex:1"></span><select id="fs" style="width:auto;min-height:38px;font-size:14px;flex:none;padding:0 10px">${SORTS.map(([k,l])=>`<option value="${k}" ${F.sort===k?'selected':''}>${l}</option>`).join('')}</select></div><div id="lrows"></div>`;
  bindMain(P);
  $('sq').oninput=e=>{F.q=e.target.value;fSave();paintRows()};

  paintRows();
}
function paintRows(){

/* ---------- Ridimensiona: raddrizzamento prospettico (offline) ---------- */
function homog(P,Q){
  const A=[],B=[];
  for(let i=0;i<4;i++){const[u,v]=Q[i],[x,y]=P[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]);B.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]);B.push(y)}
  const n=8;
  for(let i=0;i<n;i++){
    let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];[B[i],B[m]]=[B[m],B[i]];
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];B[r]-=f*B[i]}
  }
  const h=new Array(n);
  for(let i=n-1;i>=0;i--){let t=B[i];for(let c=i+1;c<n;c++)t-=A[i][c]*h[c];h[i]=t/A[i][i]}
  return h;
}
function warp(S,P,W,H){
  const h=homog(P,[[0,0],[W,0],[W,H],[0,H]]),sd=S.data,sw=S.width,sh=S.height;
  const out=new ImageData(W,H),od=out.data,mx=sw-1.001,my=sh-1.001;
  for(let j=0;j<H;j++){
    for(let i=0;i<W;i++){
      const u=i+.5,v=j+.5,d=h[6]*u+h[7]*v+1;
      let x=(h[0]*u+h[1]*v+h[2])/d-.5,y=(h[3]*u+h[4]*v+h[5])/d-.5;
      x=x<0?0:x>mx?mx:x;y=y<0?0:y>my?my:y;
      const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,k=(y0*sw+x0)*4,k2=k+sw*4;
      const a=(1-fx)*(1-fy),b=fx*(1-fy),c=(1-fx)*fy,e=fx*fy,o=(j*W+i)*4;
      od[o]=sd[k]*a+sd[k+4]*b+sd[k2]*c+sd[k2+4]*e;
      od[o+1]=sd[k+1]*a+sd[k+5]*b+sd[k2+1]*c+sd[k2+5]*e;
      od[o+2]=sd[k+2]*a+sd[k+6]*b+sd[k2+2]*c+sd[k2+6]*e;
      od[o+3]=255;
    }
  }
  return out;
}
function openRect(){
  const cv=draft.cv,w=cv.width,h=cv.height;
  R={cv,S:null,step:1,ratio:0,drag:null,p:[[w*.1,h*.1],[w*.9,h*.1],[w*.9,h*.9],[w*.1,h*.9]]};

    A.innerHTML='<canvas id="pc"></canvas>';

    R.ratio=Math.min(2.5,Math.max(.4,R.ratio));

    $('rs').value=R.ratio;
    let q=0;$('rs').oninput=e=>{R.ratio=+e.target.value;if(!q)q=requestAnimationFrame(()=>{q=0;rPrev()})};

const rScr=p=>[p[0]*R.d.s+R.d.ox,p[1]*R.d.s+R.d.oy];
function rSetup(){
  const A=$('ra'),c=$('rc'),dpr=Math.min(3,window.devicePixelRatio||2);
  const aw=A.clientWidth,ah=A.clientHeight;
  c.width=aw*dpr;c.height=ah*dpr;
  const s=Math.min(aw/R.cv.width,ah/R.cv.height);
  R.d={dpr,aw,ah,s,ox:(aw-R.cv.width*s)/2,oy:(ah-R.cv.height*s)/2};
  const l=$('lc');l.width=132*dpr;l.height=132*dpr;l.style.width=l.style.height='132px';
  rDraw();
  c.onpointerdown=e=>{
    let best=-1,bd=64;
    R.p.forEach((p,i)=>{const q=rScr(p),d=Math.hypot(q[0]-e.offsetX,q[1]-e.offsetY);if(d<bd){bd=d;best=i}});
    if(best<0)return;
    const q=rScr(R.p[best]);R.drag={i:best,dx:q[0]-e.offsetX,dy:q[1]-e.offsetY};
    c.setPointerCapture(e.pointerId);rLoupe();
  };
  c.onpointermove=e=>{
    if(!R.drag)return;
    const X=Math.max(0,Math.min(R.d.aw,e.offsetX+R.drag.dx)),Y=Math.max(0,Math.min(R.d.ah,e.offsetY+R.drag.dy));
    R.p[R.drag.i]=[(X-R.d.ox)/R.d.s,(Y-R.d.oy)/R.d.s];
    rDraw();rLoupe();
  };
  c.onpointerup=c.onpointercancel=()=>{R.drag=null;$('lp').style.display='none';rDraw()};
}
function rDraw(){
  const d=R.d,c=$('rc'),x=c.getContext('2d');
  x.setTransform(d.dpr,0,0,d.dpr,0,0);x.clearRect(0,0,d.aw,d.ah);
  x.drawImage(R.cv,d.ox,d.oy,R.cv.width*d.s,R.cv.height*d.s);
  const P=R.p.map(rScr);
  x.lineWidth=2;x.strokeStyle='#ffd36b';x.beginPath();
  P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
  P.forEach((p,i)=>{
    x.beginPath();x.arc(p[0],p[1],15,0,6.2832);x.fillStyle='rgba(255,211,107,.18)';x.fill();
    x.lineWidth=2.5;x.strokeStyle='#ffd36b';x.stroke();
    x.beginPath();x.arc(p[0],p[1],2.5,0,6.2832);x.fillStyle='#ffd36b';x.fill();
    x.fillStyle='#fff';x.font='600 12px -apple-system,sans-serif';x.fillText(i+1,p[0]+19,p[1]-12);
  });
}
function rLoupe(){

const ptr=new Map();let G=null;const A=$('area');
const mid2=()=>{const v=[...ptr.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2,d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1}};

  if($('panel').style.display==='block'||e.target.id==='zr')return;
  if(e.isPrimary){ptr.clear();G=null}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=$('stage').getBoundingClientRect();
  if(ptr.size===2){const m=mid2();G={m:'p',d:m.d,k:Z.k,fx:(m.x-r.left-Z.x)/Z.k,fy:(m.y-r.top-Z.y)/Z.k}}

  else G=null;

  if(!ptr.has(e.pointerId)||!G)return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=$('stage').getBoundingClientRect();
  if(G.m==='p'&&ptr.size===2){
    const m=mid2();Z.k=Math.min(6,Math.max(1,G.k*m.d/G.d));
    Z.x=m.x-r.left-G.fx*Z.k;Z.y=m.y-r.top-G.fy*Z.k;applyZ();

function pend(e){
  if(!ptr.has(e.pointerId))return;
  ptr.delete(e.pointerId);const g=G;
  if(ptr.size>0){if(g&&g.m==='p'){const v=[...ptr.values()][0];G={m:'o',sx:v.x,sy:v.y,x:Z.x,y:Z.y,moved:true}}return}
  G=null;if(Z.k<1.05)zreset();

const hasCrypto=()=>!!(window.crypto&&window.crypto.subtle);
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:100000,hash:'SHA-256'},k,256);
  return b64(new Uint8Array(bits));
}

async function chatLoad(){

function bindSoc(P){P.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{view=b.dataset.sv;render()})}
async function relLoad(){

async function frDo(paths){
  if(!needNet())return false;
  try{await net('PATCH','',paths);return true}catch(e){toast('Non riuscito: controlla la connessione');return false}
}
async function frSend(k){
  if(S.rel.in[k])return frAccept(k);
  const t=Date.now();
  if(await frDo({[`rel/${k}/in/${sess.key}`]:t,[`rel/${sess.key}/out/${k}`]:t})){S.rel.out[k]=t;toast('Richiesta inviata a '+uname(k))}
  refreshRel();
}
async function frAccept(k){
  const t=Date.now();
  if(await frDo({[`rel/${sess.key}/in/${k}`]:null,[`rel/${k}/out/${sess.key}`]:null,[`rel/${sess.key}/fr/${k}`]:t,[`rel/${k}/fr/${sess.key}`]:t})){delete S.rel.in[k];delete S.rel.out[k];S.rel.fr[k]=t;toast('Ora tu e '+uname(k)+' siete amici')}
  refreshRel();
}
async function frDecline(k){if(await frDo({[`rel/${sess.key}/in/${k}`]:null,[`rel/${k}/out/${sess.key}`]:null}))delete S.rel.in[k];refreshRel()}
async function frCancel(k){if(await frDo({[`rel/${k}/in/${sess.key}`]:null,[`rel/${sess.key}/out/${k}`]:null})){delete S.rel.out[k];toast('Richiesta annullata')}refreshRel()}
async function frRemove(k){
  if(!confirm('Rimuovere '+uname(k)+' dagli amici?'))return;
  if(await frDo({[`rel/${sess.key}/fr/${k}`]:null,[`rel/${k}/fr/${sess.key}`]:null})){delete S.rel.fr[k];toast('Amico rimosso')}

function paintPeople(){
  const el=$('plist');if(!el||view!=='people')return;
  if(!S.users){el.innerHTML='<div class="mu" style="padding:8px 2px">Carico…</div>';return}
  const us=S.users,q=norm(PQ.trim());

    (oth.length?sect('Nel gruppo',oth.length)+oth.map(k=>row(k,'oth')).join(''):'')+
    (ks.length?'':`<div class="empty">${q?'Nessuna persona trovata.':'Nel gruppo ci sei solo tu, per ora.<br>Condividi il codice del gruppo con i tuoi amici.'}</div>`);

function myStats(){
  const all=[];D.panels.forEach(pn=>pn.problems.forEach(b=>all.push({pn,b})));
  const sent=all.filter(o=>o.b.send),gd={};
  sent.forEach(o=>{const g=o.b.send.g||o.b.grade;gd[g]=(gd[g]||0)+1});
  const best=Object.keys(gd).sort((a,b)=>GR.indexOf(b)-GR.indexOf(a))[0]||'';
  const asc=sent.map(o=>({n:o.b.name||'Senza nome',g:o.b.grade,v:o.b.send.g||o.b.grade,pn:o.pn.name,d:o.b.send.d,a:o.b.send.a,s:o.b.send.s||0})).sort((a,b)=>b.d-a.d).slice(0,20);
  return{st:{tr:all.filter(o=>!o.b.from).length,sn:sent.length,best,gd,u:Date.now()},asc};
}
async function syncStats(){
  if(!social()||!sess.ok||!navigator.onLine)return;
  const m=myStats(),hide=(sess.prof&&sess.prof.vis)==='none';
  try{
    await net('PATCH','',{[`users/${sess.key}/st`]:hide?null:m.st,[`asc/${sess.key}`]:(hide||!m.asc.length)?null:m.asc});
    S.dirty=false;
  }catch(e){S.dirty=true}
}
function markStats(){if(!social())return;S.dirty=true;clearTimeout(markStats.h);markStats.h=setTimeout(()=>{syncStats()},1200)}
function statsHTML(st,asc){
  const gd=st.gd||{},gs=Object.keys(gd).sort((a,b)=>GR.indexOf(b)-GR.indexOf(a)),mx=Math.max(1,...gs.map(g=>gd[g]));
  const dt=d=>new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
  return `<div class="stats"><div><b>${st.tr||0}</b><span>Tracciati</span></div><div><b>${st.sn||0}</b><span>Saliti</span></div><div><b>${st.best||'–'}</b><span>Grado max</span></div></div>
  ${gs.length?`<div class="sect">Piramide dei gradi</div><div class="pyr">${gs.map(g=>`<div class="pr"><span style="color:${gcol(g)}">${g}</span><div><i style="width:${Math.max(6,gd[g]/mx*100)}%;background:${gcol(g)}"></i></div><b>${gd[g]}</b></div>`).join('')}</div>`:''}
  <div class="sect">Ultime salite</div>${asc&&asc.length?asc.slice(0,15).map(a=>`<div class="item"><span class="gr" style="color:${gcol(a.g)}">${esc(a.g)}</span><span class="nm">${esc(a.n)}<small>${esc(a.pn||'')} · ${dt(a.d)}${a.a?' · '+a.a+(a.a==1?' tentativo':' tentativi'):''}${a.v&&a.v!==a.g?' · voto '+esc(a.v):''}</small></span><span class="ok">${'★'.repeat(a.s||0)}</span></div>`).join(''):'<div class="mu" style="padding:2px 2px 10px">Ancora nessuna salita.</div>'}`;
}
async function openUser(k,back){
  if(!social()||!sess.ok){toast('Serve il gruppo e la connessione internet');return}
  UP={key:k,back:back||view,u:(S.users&&S.users[k])||null,asc:[],loading:true};
  view='uprof';render();
  try{
    if(Date.now()-S.relT>5000)await relLoad().catch(()=>{});
    const u=await net('GET','users/'+k)||{n:k};
    if(!UP||UP.key!==k)return;
    UP.u=u;if(S.users)S.users[k]=u;
    if(k!==sess.key&&canSee(u,k)){const a=await net('GET','asc/'+k)||[];UP.asc=(Array.isArray(a)?a:Object.values(a)).filter(Boolean).sort((x,y)=>(y.d||0)-(x.d||0))}
    UP.loading=false;
  }catch(e){if(UP&&UP.key===k){UP.loading=false;UP.err=1}}
  if(UP&&UP.key===k&&view==='uprof')render();
}

let LB=null;
function lbApply(){
  const i=$('lbi'),w=i.clientWidth,h=i.clientHeight,mx=Math.max(0,(w*LB.k-innerWidth)/2),my=Math.max(0,(h*LB.k-innerHeight)/2);
  LB.x=Math.max(-mx,Math.min(mx,LB.x));LB.y=Math.max(-my,Math.min(my,LB.y));
  i.style.transform=`translate(-50%,-50%) translate(${LB.x}px,${LB.y}px) scale(${LB.k})`;
}
function lbOpen(src,name,key){
  LB={key,k:1,x:0,y:0,p:new Map(),g:null,tap:0};
  $('lbi').src=src;$('lbn').textContent=name||'';$('lightbox').style.display='block';lbApply();
}
function lbClose(){$('lightbox').style.display='none';LB=null}
function lbMid(){const v=[...LB.p.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2,d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1}}
$('lbx').onclick=lbClose;
$('lightbox').addEventListener('pointerdown',e=>{
  if(!LB||e.target.id==='lbx')return;
  if(e.isPrimary){LB.p.clear();LB.g=null}
  LB.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const cx=innerWidth/2,cy=innerHeight/2;
  if(LB.p.size===2){const m=lbMid();LB.g={m:'p',d:m.d,k:LB.k,px:(m.x-cx-LB.x)/LB.k,py:(m.y-cy-LB.y)/LB.k}}
  else if(LB.p.size===1)LB.g={m:'o',sx:e.clientX,sy:e.clientY,x:LB.x,y:LB.y,moved:false};
});
$('lightbox').addEventListener('pointermove',e=>{
  if(!LB||!LB.p.has(e.pointerId)||!LB.g)return;
  LB.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const cx=innerWidth/2,cy=innerHeight/2;
  if(LB.g.m==='p'&&LB.p.size===2){const m=lbMid();LB.k=Math.min(6,Math.max(1,LB.g.k*m.d/LB.g.d));LB.x=m.x-cx-LB.g.px*LB.k;LB.y=m.y-cy-LB.g.py*LB.k;lbApply()}
  else if(LB.g.m==='o'){const dx=e.clientX-LB.g.sx,dy=e.clientY-LB.g.sy;if(Math.hypot(dx,dy)>8)LB.g.moved=true;if(LB.k>1.02&&LB.g.moved){LB.x=LB.g.x+dx;LB.y=LB.g.y+dy;lbApply()}}
});
function lbEnd(e){
  if(!LB||!LB.p.has(e.pointerId))return;
  LB.p.delete(e.pointerId);const g=LB.g;
  if(LB.p.size>0){if(g&&g.m==='p'){const v=[...LB.p.values()][0];LB.g={m:'o',sx:v.x,sy:v.y,x:LB.x,y:LB.y,moved:true}}return}
  LB.g=null;if(LB.k<1.05){LB.k=1;LB.x=0;LB.y=0;lbApply()}
  if(!g||g.m!=='o'||g.moved||e.type==='pointercancel')return;
  const now=Date.now();
  if(now-LB.tap<320){   // doppio tocco: ingrandisce o riporta a misura
    LB.tap=0;
    if(LB.k>1.2){LB.k=1;LB.x=0;LB.y=0}else{LB.k=2.6;LB.x=-(e.clientX-innerWidth/2)*1.6;LB.y=-(e.clientY-innerHeight/2)*1.6}
    lbApply();return;
  }
  LB.tap=now;
  const r=$('lbi').getBoundingClientRect();
  if((e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)&&LB.k<=1.02)setTimeout(()=>{if(LB&&LB.tap===now)lbClose()},330);
}
$('lightbox').addEventListener('pointerup',lbEnd);$('lightbox').addEventListener('pointercancel',lbEnd);

const hs=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)+'.'+t.length};
const ens=()=>D.sync||(D.sync={o:'',h:{},u:{},ph:{},ru:0,t:0});
const BLV=b=>({id:b.id,name:b.name||'',grade:b.grade,holds:b.holds||[],note:b.note||'',send:b.send||null,by:b.by||'',from:b.from||'',rid:b.rid||'',c:b.c||0,sh:b.sh||null});
const arr=x=>Array.isArray(x)?x:Object.values(x||{});
function snap(){
  const E={};
  D.panels.forEach(p=>{
    if(!p.pv)p.pv=Date.now();
    E['p:'+p.id]={h:hs(JSON.stringify([p.name,p.ar,p.pv])),v:{n:p.name,ar:p.ar,pv:p.pv}};
    p.problems.forEach(b=>{const v=BLV(b);E['b:'+p.id+':'+b.id]={h:hs(JSON.stringify(v)),v}});
  });
  D.lists.forEach(l=>{const v={n:l.name,it:l.items||[]};E['l:'+l.id]={h:hs(JSON.stringify(v)),v}});
  const pf={prefs:D.prefs||{}};E.pf={h:hs(JSON.stringify(pf)),v:pf};
  return E;
}
function delLocal(t,a,b){
  const sy=ens();
  if(t==='p'){D.panels=D.panels.filter(p=>p.id!==+a);Object.keys(sy.h).forEach(x=>{if(x.indexOf('b:'+a+':')===0)delete sy.h[x]})}
  else if(t==='b'){const p=D.panels.find(x=>x.id===+a);if(p)p.problems=p.problems.filter(x=>x.id!==+b)}
  else if(t==='l')D.lists=D.lists.filter(l=>l.id!==+a);
}
async function putLocal(t,a,b,r){
  if(t==='p'){
    let p=D.panels.find(x=>x.id===+a);
    if(!p||p.pv!==r.pv||!p.photo){
      let ph;try{ph=await net('GET','udp/'+sess.key+'/'+a,undefined,'',40000)}catch(e){return false}
      if(!ph)return false;
      if(!p){p={id:+a,name:r.n,ar:r.ar,photo:ph,pv:r.pv,problems:[],up:false};D.panels.push(p)}
      else{p.photo=ph;p.up=false}
    }
    p.name=r.n;p.ar=r.ar;p.pv=r.pv;ens().ph[a]=r.pv;return true;
  }
  if(t==='b'){
    const p=D.panels.find(x=>x.id===+a);if(!p)return false;
    const nb={id:+b,name:r.name||'',grade:r.grade,holds:arr(r.holds),note:r.note||'',send:r.send||null,c:r.c||0};
    if(r.by)nb.by=r.by;if(r.from)nb.from=r.from;if(r.rid)nb.rid=r.rid;if(r.sh)nb.sh=r.sh;
    const i=p.problems.findIndex(x=>x.id===+b);if(i>=0)p.problems[i]=nb;else p.problems.push(nb);return true;
  }
  if(t==='l'){const nl={id:+a,name:r.n||'',items:arr(r.it)},i=D.lists.findIndex(x=>x.id===+a);if(i>=0)D.lists[i]=nl;else D.lists.push(nl);return true}
  if(t==='pf'){D.prefs=Object.assign({},r.prefs||{});return true}
  return false;
}
async function mergeRemote(rem){
  const sy=ens(),loc=snap(),R={},keys=[],done=[];
  const add=(k,v)=>{R[k]=v;keys.push(k)};
  Object.keys(rem.p||{}).forEach(id=>add('p:'+id,rem.p[id]));
  Object.keys(rem.b||{}).forEach(pid=>Object.keys(rem.b[pid]||{}).forEach(bid=>add('b:'+pid+':'+bid,rem.b[pid][bid])));
  Object.keys(rem.l||{}).forEach(id=>add('l:'+id,rem.l[id]));
  if(rem.pf)add('pf',rem.pf);
  let ch=false;
  for(const key of keys){
    const r=R[key];if(!r||typeof r!=='object'||r.u===sy.u[key])continue;
    const l=loc[key],lc=!!l&&l.h!==sy.h[key]&&!(key==='pf'&&sy.h.pf===undefined&&!Object.keys(D.prefs||{}).length),p=key.split(':');
    if(r.d){if(l&&!lc){delLocal(p[0],p[1],p[2]);ch=true;delete sy.h[key]}sy.u[key]=r.u;continue}
    if(l&&lc){sy.u[key]=r.u;continue}              // modificato su entrambi: vince questo dispositivo
    if(await putLocal(p[0],p[1],p[2],r)){ch=true;sy.u[key]=r.u;done.push(key)}
  }
  const l2=snap();done.forEach(k=>{if(l2[k])sy.h[k]=l2[k].h});
  return ch;
}
async function pushLocal(ru){
  const sy=ens(),loc=snap(),now=Date.now(),k=sess.key,up={},acts=[],gone=new Set(),photos=[];
  Object.keys(sy.h).forEach(key=>{
    if(loc[key])return;const p=key.split(':');
    if(p[0]==='p'){up[`ud/${k}/p/${p[1]}`]={d:1,u:now};up[`ud/${k}/b/${p[1]}`]=null;up[`udp/${k}/${p[1]}`]=null;gone.add(p[1]);acts.push([key,0]);delete sy.ph[p[1]]}
  });
  Object.keys(sy.h).forEach(key=>{
    if(loc[key])return;const p=key.split(':');
    if(p[0]==='b'&&!gone.has(p[1])){up[`ud/${k}/b/${p[1]}/${p[2]}`]={d:1,u:now};acts.push([key,0])}
    else if(p[0]==='l'){up[`ud/${k}/l/${p[1]}`]={d:1,u:now};acts.push([key,0])}
  });
  Object.keys(loc).forEach(key=>{
    if(loc[key].h===sy.h[key])return;
    if(key==='pf'&&sy.h.pf===undefined&&!Object.keys(D.prefs||{}).length)return;
    const p=key.split(':'),v=Object.assign({},loc[key].v,{u:now});
    if(p[0]==='p'){if(sy.ph[p[1]]!==loc[key].v.pv)photos.push(p[1]);up[`ud/${k}/p/${p[1]}`]=v}
    else if(p[0]==='b')up[`ud/${k}/b/${p[1]}/${p[2]}`]=v;
    else if(p[0]==='l')up[`ud/${k}/l/${p[1]}`]=v;
    else up[`ud/${k}/pf`]=v;
    acts.push([key,1]);
  });
  if(!acts.length&&!photos.length)return false;
  for(const a of photos){const pn=D.panels.find(x=>x.id===+a);if(pn&&pn.photo){await net('PUT','udp/'+k+'/'+a,pn.photo,'',60000);sy.ph[a]=pn.pv}}
  const ents=Object.entries(up);
  for(let i=0;i<ents.length;i+=40){const o={};ents.slice(i,i+40).forEach(([x,y])=>{o[x]=y});await net('PATCH','',o,'',30000)}
  const same=(await net('GET','ud/'+k+'/u'))===ru;
  await net('PATCH','',{[`ud/${k}/u`]:now});
  acts.forEach(([key,put])=>{if(put){sy.h[key]=loc[key].h;sy.u[key]=now}else{delete sy.h[key];sy.u[key]=now}});
  gone.forEach(a=>Object.keys(sy.h).forEach(x=>{if(x.indexOf('b:'+a+':')===0)delete sy.h[x]}));
  if(same)sy.ru=now;
  return true;
}

async function cloudSync(force,manual){
  if(!social()||!sess.ok||sess.local){if(manual)toast('Accedi con il tuo account per sincronizzare');return}
  if(!navigator.onLine){if(manual)toast('Sei offline');return}

  try{
    const sy=ens();if(!sy.o)sy.o=sess.key;
    const ru=await net('GET','ud/'+sess.key+'/u');

      const rem=await net('GET','ud/'+sess.key,undefined,'',40000)||{};
      ch=await mergeRemote(rem);
    }

  }catch(e){S.cs={st:'err',t:(D.sync&&D.sync.t)||0};if(manual)toast('Sincronizzazione non riuscita')}

}
